name: Docker Scan with Trivy
description: "Scan a Docker image for vulnerabilities using Trivy and output the results in SARIF format."

inputs:
  image:
    description: "Docker image to scan (e.g. my-image:latest)"
    required: true

  exemption_key:
    description: >
      Key used to look up a centrally managed HIGH/CRITICAL exemption file, stored in
      Home-Office-Digital/core-cloud-cve-exemptions at exemptions/<exemption_key>.trivyignore.yaml.
    required: false
    type: string
    default: ""

  app_id:
    description: Exemptions secret applied by the Core Cloud team when exemptions are approved and required.
    required: false
    type: string
    default: ""

  app_private_key:
    description: Exemptions secret applied by the Core Cloud team when exemptions are approved and required.
    required: false
    type: string
    default: ""

outputs:
  trivy_scan_exit_code:
    description: "The exit code from the Trivy scan command"
    value: ${{ steps.trivy_scan_exit_code.outputs.exit_code }}

  exemption_file_applied:
    description: "Path to the centrally managed exemption file applied to this scan, empty if none matched"
    value: ${{ steps.resolve_exemptions.outputs.ignorefile_path }}

runs:
  using: "composite"

  steps:
    - name: Mint exemptions repo token
      id: mint_token
      if: inputs.app_id != '' && inputs.app_private_key != ''
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        client-id: ${{ inputs.app_id }}
        private-key: ${{ inputs.app_private_key }}
        owner: Home-Office-Digital
        repositories: core-cloud-cve-exemptions

    - name: Resolve centrally managed exemptions
      id: resolve_exemptions
      shell: bash
      env:
        EXEMPTIONS_TOKEN: ${{ steps.mint_token.outputs.token }}
      run: |
        set -e

        if [ -z "$EXEMPTIONS_TOKEN" ]; then
          echo "No exemptions app credentials configured for this repo - skipping exemption lookup"
          echo "ignorefile_path=" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        key="${{ inputs.exemption_key }}"
        if [ -z "$key" ]; then
          key="${{ github.repository }}"
        fi

        case "$key" in
          *..*)
            echo "::error::exemption_key '$key' must not contain '..'"
            exit 1
            ;;
        esac

        exemptions_file="$(mktemp "$RUNNER_TEMP/exemption-XXXXXX.yaml")"

        status="$(curl -s -o "$exemptions_file" -w '%{http_code}' \
          -H "Authorization: Bearer $EXEMPTIONS_TOKEN" \
          -H "Accept: application/vnd.github.raw+json" \
          "https://api.github.com/repos/Home-Office-Digital/core-cloud-cve-exemptions/contents/exemptions/${key}.trivyignore.yaml")"

        if [ "$status" = "200" ]; then
          echo "Applying centrally managed exemption file for '$key'"
          echo "ignorefile_path=$exemptions_file" >> "$GITHUB_OUTPUT"
        elif [ "$status" = "404" ]; then
          echo "No centrally managed exemptions found for '$key'"
          echo "ignorefile_path=" >> "$GITHUB_OUTPUT"
        else
          echo "::error::Failed to fetch exemption file for '$key' (HTTP $status)"
          exit 1
        fi

    - name: Run Trivy vulnerability scanner
      id: trivy_scan
      # Home-Office-Digital/trivy-action@v0.35.0
      uses: Home-Office-Digital/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
      env:
        TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db:2
        TRIVY_JAVA_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-java-db:1
      with:
        image-ref: ${{ inputs.image }}
        severity: "HIGH,CRITICAL"
        vuln-type: "os,library"
        exit-code: 1
        trivyignores: ${{ steps.resolve_exemptions.outputs.ignorefile_path }}

    - name: Set Trivy scan exit code
      id: trivy_scan_exit_code
      if: always()
      shell: bash
      run: |
        if [ "${{ steps.trivy_scan.conclusion }}" = "success" ]; then
          echo "exit_code=0" >> $GITHUB_OUTPUT
        else
          echo "exit_code=1" >> $GITHUB_OUTPUT
        fi
