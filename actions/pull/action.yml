name: Docker pull
description: "Pull a Docker image image name and tag, from ECR via an assumed AWS role."

inputs:


  image_name:
    description: "Name of the image"
    required: true
    type: string

  image_tag:
    description: "The tag for the image (default: latest)"
    required: false
    type: string
    default: latest

  tag_latest:
    description: "Should it also use the tag latest (default: true)"
    required: false
    type: boolean
    default: true

  aws_region:
    description: "AWS region for ECR"
    required: false
    type: string
    default: "eu-west-2"
  
  aws_ecr_account_id:
    description: "AWS Account ID for ECR"
    required: true
    type: string

  role_to_assume:
    description: "The role to assume for AWS ECR access"
    required: true
    type: string

runs:
  using: "composite"

  steps:
    - name: Assume Role in Account
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ inputs.role_to_assume }}
        aws-region: ${{ inputs.aws_region }}

    - name: Login to Amazon ECR
      uses: aws-actions/amazon-ecr-login@v2