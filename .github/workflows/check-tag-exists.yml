name: Check the image tag already exists or not

on:
  workflow_call:
    inputs:
      image_name:
        description: "Name of the image"
        required: true
        type: string
      image_tag:
        description: "The tag for the image (default: latest)"
        required: false
        type: string

    secrets:
      AWS_ECR_ACCOUNT_ID:
        description: "AWS Account ID for ECR"
        required: true
      ROLE_TO_ASSUME:
        description: "The role to assume for AWS ECR access"
        required: true

jobs:
  check-tag-exists:
    name: "Check the image tag already exists or not"
    runs-on: ubuntu-latest

    steps: 
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up Docker 
        uses: Home-Office-Digital/core-cloud-workflow-docker-actions/actions/setup@1.2.0

      - name: Push Docker Image to ECR
        uses: Home-Office-Digital/core-cloud-workflow-docker-actions/actions/check-tag@CCL-9403
        with:
          image_name: ${{ inputs.image_name }}
          image_tag: ${{ inputs.image_tag }}
          aws_region: "eu-west-2"
          aws_ecr_account_id: ${{ secrets.AWS_ECR_ACCOUNT_ID }}
          role_to_assume: ${{ secrets.ROLE_TO_ASSUME }}